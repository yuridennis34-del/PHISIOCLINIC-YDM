
name: Construir PHISIOCLINIC YDM APK 4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto Android
        run: |
          mkdir proyecto
          unzip -q PHISIOCLINIC_YDM_Android_Proyecto_V4.1.zip -d proyecto
          MANIFEST=$(find proyecto -path '*/app/src/main/AndroidManifest.xml' | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "No se encontró AndroidManifest.xml"
            exit 1
          fi
          PROJECT_DIR="${MANIFEST%/app/src/main/AndroidManifest.xml}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar navegación
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          html = project / "app/src/main/assets/index.html"
          if not html.exists():
              raise SystemExit("No se encontró index.html")
          content = html.read_text(encoding="utf-8")
          old = r"}\nfunction exportAgenda"
          new = "}\nfunction exportAgenda"
          if old in content:
              content = content.replace(old, new, 1)
              html.write_text(content, encoding="utf-8")
              print("Navegación corregida")
          elif "function exportAgenda" in content:
              print("La navegación ya está corregida")
          else:
              raise SystemExit("No se encontró la función de exportación de agenda")
          PY

      - name: Configurar Android versión 4.1
        run: |
          cd "$PROJECT_DIR"
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PHISIOCLINIC-YDM'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.phisioclinic.ydm'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.phisioclinic.ydm.v41'
                  minSdk 23
                  targetSdk 34
                  versionCode 5
                  versionName '4.1'
              }
          }
          EOF

      - name: Configurar logo de PHISIOCLINIC
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import os, re, base64
          from pathlib import Path
          from io import BytesIO
          from PIL import Image

          project = Path(os.environ["PROJECT_DIR"])
          html = project / "app/src/main/assets/index.html"
          content = html.read_text(encoding="utf-8")
          tags = re.findall(r"<img\b[^>]*>", content, flags=re.I)
          logo_tag = next((tag for tag in tags if "Logotipo PHISIOCLINIC YDM" in tag), None)
          if logo_tag is None:
              raise SystemExit("No se encontró el logotipo de PHISIOCLINIC")
          match = re.search(r'\bsrc=["\']data:image/[^;]+;base64,([^"\']+)', logo_tag, flags=re.I)
          if match is None:
              raise SystemExit("No se pudo extraer el logotipo")
          logo = Image.open(BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, size in sizes.items():
              target = project / "app/src/main/res" / folder
              target.mkdir(parents=True, exist_ok=True)
              logo.resize((size, size), Image.Resampling.LANCZOS).save(target / "ic_launcher.png")
          manifest = project / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")
          if "android:icon=" not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"',
                  1
              )
          manifest.write_text(text, encoding="utf-8")
          print("Logo PHISIOCLINIC configurado")
          PY

      - name: Construir APK versión 4.1
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PHISIOCLINIC-YDM-APK-4.1
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
